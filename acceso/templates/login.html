{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            
            <!-- Cabecera de la Tarjeta -->
            <div class="card-header text-center text-white py-4" style="background: linear-gradient(135deg, #0f5132 0%, #198754 100%);">
                <img src="https://www.colegionocedal.cl/30-a%c3%b1os-firma/images/ins_cn_30_2_lmm.png" 
                     alt="Logo Nocedal" style="height: 65px;" class="mb-2 bg-white rounded-3 p-1 shadow-sm">
                <h4 class="fw-bold mb-0">Iniciar Sesión</h4>
                <p class="small text-white-50 mb-0">Control de Acceso Escolar</p>
            </div>

            <!-- Cuerpo del Formulario -->
            <div class="card-body p-4 p-md-5 bg-white">
                
                {% if form.errors %}
                    <div class="alert alert-danger alert-dismissible fade show rounded-3 small mb-4" role="alert">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        <strong>Error:</strong> Credenciales inválidas. Inténtalo nuevamente.
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endif %}

                <form method="POST" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold text-secondary">
                            <i class="fas fa-user me-1 text-success"></i> Nombre de Usuario
                        </label>
                        <input type="text" 
                               name="username" 
                               class="form-control rounded-3 py-2" 
                               id="id_username" 
                               placeholder="Ingresa tu usuario" 
                               required 
                               autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label fw-semibold text-secondary">
                            <i class="fas fa-lock me-1 text-success"></i> Contraseña
                        </label>
                        <input type="password" 
                               name="password" 
                               class="form-control rounded-3 py-2" 
                               id="id_password" 
                               placeholder="Ingresa tu contraseña" 
                               required>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold rounded-pill shadow-sm">
                        <i class="fas fa-sign-in-alt me-2"></i> Ingresar
                    </button>
                </form>
            </div>

            <!-- Pie de la Tarjeta -->
            <div class="card-footer bg-light text-center py-3 border-0">
                <small class="text-muted">
                    <i class="fas fa-shield-alt me-1 text-success"></i> Acceso exclusivo para personal de portería y administración
                </small>
            </div>

        </div>
    </div>
</div>
{% endblock %}
